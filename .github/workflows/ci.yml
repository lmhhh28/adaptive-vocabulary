name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (contracts & freeze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - name: Run checks
        run: make check

  test:
    name: Test (Go & Worker unit tests)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - name: Run Go tests
        run: make test-go
      - name: Run Go tests with race detector
        run: make test-race
      - name: Run Worker tests
        run: make test-worker

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - name: Build production binary
        run: make build
      - name: Build E2E binary
        run: make build-e2e
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: avocab-binaries
          path: |
            bin/avocab
            bin/avocab-e2e
          retention-days: 7

