name: Setup Toolchain
description: Install Go, uv, and project dependencies with caching

runs:
  using: composite
  steps:
    - name: Cache toolchain and build artifacts
      uses: actions/cache@v4
      with:
        path: |
          .tools/
          .cache/
        key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.py', 'go.sum', 'worker/uv.lock', 'e2e/uv.lock') }}
        restore-keys: |
          toolchain-${{ runner.os }}-

    - name: Bootstrap toolchain (Go + uv)
      shell: bash
      run: make bootstrap

    - name: Install Python via uv (standalone build with correct SQLite)
      shell: bash
      run: .tools/uv/bin/uv python install 3.13.15

    - name: Sync dependencies
      shell: bash
      run: make sync
