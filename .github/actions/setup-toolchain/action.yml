name: Setup Toolchain
description: Install Go, uv, and project dependencies with caching

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Cache toolchain and build artifacts
      uses: actions/cache@v4
      with:
        path: |
          .tools/
          .cache/
        key: toolchain-${{ runner.os }}-${{ hashFiles('scripts/bootstrap.py', 'go.sum', 'worker/uv.lock', 'e2e/uv.lock') }}
        restore-keys: |
          toolchain-${{ runner.os }}-

    - name: Bootstrap toolchain
      shell: bash
      run: make bootstrap

    - name: Sync dependencies
      shell: bash
      run: make sync
